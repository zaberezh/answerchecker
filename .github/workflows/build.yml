name: Build EXE

on:
  push:
    branches: [ claude/beautiful-volta-yioyk1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and PyInstaller
        run: |
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build main.py -> exe
        run: pyinstaller --onefile --noconsole --name app main.py

      - name: Install PS2EXE
        shell: pwsh
        run: Install-Module -Name ps2exe -Scope CurrentUser -Force

      - name: Build script.ps1 -> exe
        shell: pwsh
        run: Invoke-PS2EXE -InputFile script.ps1 -OutputFile dist/script.exe

      - uses: actions/upload-artifact@v4
        with:
          name: exe-files
          path: dist/*.exe
