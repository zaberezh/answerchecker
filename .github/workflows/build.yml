name: Build EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tesseract OCR
        shell: pwsh
        run: choco install tesseract -y --no-progress

      - name: Build screen_qa.exe
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build_exe.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: screen_qa
          path: dist/screen_qa.exe
